<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Арена — вход</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1522;color:#eee9df;font:16px system-ui;padding:24px}form{width:min(360px,100%);padding:28px;border:1px solid #46505a;border-radius:12px;background:#17212e}h1{font:32px Georgia;margin:0 0 12px}input[type=password],button{width:100%;padding:14px;margin:12px 0;border:1px solid #64717d;border-radius:5px;font:inherit}input[type=password]{background:#0d1522;color:white}button{background:#e1ad64;color:#20170b;cursor:pointer}button:disabled{opacity:.6}label{font-size:14px}#status{font-size:14px;min-height:20px;color:#b9c5cf}</style></head>
<body><form id="unlock"><h1>Арена</h1><p>Введите пароль для входа в игру.</p><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required autofocus><label><input id="remember" type="checkbox" checked> Запомнить вход на этом устройстве</label><button type="submit">Войти</button><p id="status" role="status"></p></form><script>// Встраивается в страницу входа. Ни пароль, ни ключ не попадают в файлы публикации.
(async () => {
  const config = {"version":1,"salt":"+Rf+JEZPIhGm7vnQsk2ASA==","iterations":310000,"manifest":"game/0d22b1e11e8045ebc8d23b9129807eae1fd2d5149227fbfb1887b7aa48bbf785.bin"};
  const base = new URL('.', location.href), decoder = new TextDecoder(), encoder = new TextEncoder();
  const status = document.getElementById('status'), form = document.getElementById('unlock'), button = form.querySelector('button');
  const storageName = `arena-unlock:${base.pathname}`;
  const unbase64 = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
  const base64 = value => btoa(String.fromCharCode(...new Uint8Array(value)));
  async function decrypt(payload, key, path) {
    const raw = new Uint8Array(payload);
    const zipped = await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12),additionalData:encoder.encode(path),tagLength:128}, key, raw.slice(12));
    return new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }
  async function download(url) {
    const response = await fetch(new URL(url,base), {cache:'force-cache'});
    if (!response.ok) throw new Error(`Не удалось загрузить игру (${response.status}). Повторите попытку.`);
    return response.arrayBuffer();
  }
  if(!crypto.subtle || typeof DecompressionStream==='undefined'){status.textContent='Для запуска нужен современный браузер с поддержкой Web Crypto и gzip. Обновите браузер.';button.disabled=true;return;}
  let encryptedManifest;
  const manifestBytes=()=>encryptedManifest ||= download(config.manifest).catch(error=>{encryptedManifest=null;throw error;});
  manifestBytes().catch(()=>{});
  async function open(rawKey, remember) {
    const key = await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
    const manifest = JSON.parse(decoder.decode(await decrypt(await manifestBytes(),key,'manifest')));
    if(manifest.version!==1)throw new Error('Неподдерживаемая версия игры. Обновите страницу.');
    if(remember)try{localStorage.setItem(storageName,JSON.stringify({salt:config.salt,key:base64(rawKey)}));}catch{}
    const urls = new Map(), pending = new Map();
    async function bytes(path) {
      const file = manifest.files[path];
      if(!file)throw new Error(`Ресурс отсутствует в сборке: ${path}`);
      return decrypt(await download(file.url),key,path);
    }
    function resolve(specifier, file) { return new URL(specifier,new URL(file,base)).pathname.slice(base.pathname.length); }
    function prepare(file) {
      if(!pending.has(file))pending.set(file,(async()=>{
        const meta=manifest.files[file];
        if(!meta || meta.kind!=='module')throw new Error('Повреждён список модулей игры');
        await Promise.all(meta.imports.map(prepare));
        let code=decoder.decode(await bytes(file));
        code=code.replace(/\bimport\(\s*(["'`])([^"'`]+)\1\s*\)/g,(original,q,specifier)=>{
          const target=resolve(specifier,file);
          return manifest.files[target]?.kind==='module'?`globalThis.__arenaImport(${JSON.stringify(target)})`:original;
        });
        code=code.replace(/\b(from\s*|import\s*)(["'])([^"']+)\2/g,(original,prefix,q,specifier)=>{
          const target=resolve(specifier,file);
          return urls.has(target)?prefix+JSON.stringify(urls.get(target)):original;
        });
        code=code.replace(/\bimport\.meta\.url\b/g,JSON.stringify(new URL(file,base).href));
        const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));urls.set(file,url);return url;
      })());
      return pending.get(file);
    }
    globalThis.__arenaImport = async file => import(await prepare(file));
    globalThis.__arenaAssets = {
      bytes(url) {
        const resource=new URL(url,base);
        if(resource.origin!==base.origin||!resource.pathname.startsWith(base.pathname))throw new Error('Недопустимый адрес ресурса');
        return bytes(decodeURIComponent(resource.pathname.slice(base.pathname.length)));
      },
    };
    const styles=await Promise.all(manifest.styles.map(async path=>{
      let css=decoder.decode(await bytes(path));
      const refs=[...css.matchAll(/url\(["']?([^)'"\s]+)["']?\)/g)];
      for(const ref of refs){
        const resource=resolve(ref[1],path);
        if(manifest.files[resource]){const blob=URL.createObjectURL(new Blob([await bytes(resource)]));css=css.replace(ref[0],`url("${blob}")`);}
      }
      return css;
    }));
    document.open();document.write(manifest.html);document.close();
    for(const css of styles){const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);}
    try { await globalThis.__arenaImport(manifest.entry); }
    catch(error){
      const message=document.createElement('p');message.textContent='Ошибка загрузки игры. Обновите страницу и повторите вход.';message.style.cssText='position:fixed;inset:20px;z-index:99999;background:#182433;color:white;padding:20px';document.body.appendChild(message);
      console.error('Не удалось запустить модуль игры',error);
    }
  }
  form.addEventListener('submit',async event=>{
    event.preventDefault();button.disabled=true;status.textContent='Открываем игру…';
    try{
      const password=document.getElementById('password').value;
      if(!password)throw new Error('Введите пароль');
      const material=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveBits']);
      const raw=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unbase64(config.salt),iterations:config.iterations},material,256);
      const remember=document.getElementById('remember').checked;
      document.getElementById('password').value='';await open(raw,remember);
    }catch(error){status.textContent=error.name==='OperationError'?'Неверный пароль.':error.message;button.disabled=false;}
  });
  try{
    const remembered=JSON.parse(localStorage.getItem(storageName)||'null');
    if(remembered?.salt===config.salt){button.disabled=true;status.textContent='Открываем игру…';await open(unbase64(remembered.key),false);}
  }catch{try{localStorage.removeItem(storageName);}catch{}button.disabled=false;status.textContent='Введите пароль для входа.';}
})();
</script></body></html>
